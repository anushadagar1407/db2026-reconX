global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: reconx-load-backend
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: [load-backend:8080]
    # Prometheus Java client 1.x reserves the `_created` suffix and exposes the
    # Micrometer trade_created_total Counter as trade_total. Restore the ticket
    # contract at the scrape boundary without changing the application meter.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: trade_total
        target_label: __name__
        replacement: trade_created_total
