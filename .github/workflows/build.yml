name: Build

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "recon-audit-starter/**"
      - "frontend/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            recon-audit-starter/pom.xml

      - name: Build audit starter
        working-directory: recon-audit-starter
        run: ../backend/mvnw --batch-mode --no-transfer-progress install

      - name: Build backend
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Test backend on main
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: ./mvnw --batch-mode --no-transfer-progress test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Test frontend on main
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: npm test

  containers:
    name: Container (${{ matrix.component }})
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: frontend
            context: ./frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.component }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          provenance: false
          sbom: false
          tags: reconx-${{ matrix.component }}:ci
          cache-from: type=gha,scope=reconx-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=reconx-${{ matrix.component }}
