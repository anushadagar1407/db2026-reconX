$kind: http-request
url: "{{baseUrl}}/v1/trades"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 401", () => pm.response.to.have.status(401));
      pm.test("security response is status-only", () => pm.expect(pm.response.text()).to.eql(""));
    language: text/javascript
order: 1000
