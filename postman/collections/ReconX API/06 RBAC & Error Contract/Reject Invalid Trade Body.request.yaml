$kind: http-request
url: "{{baseUrl}}/v1/trades"
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "tradeRef": "invalid",
      "instrumentId": null,
      "counterpartyId": null,
      "assetClass": "",
      "side": "SIDE",
      "quantity": 0,
      "price": -1,
      "tradeDate": "2999-01-01"
    }
auth:
  type: bearer
  credentials:
    token: "{{traderToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 400", () => pm.response.to.have.status(400));
      pm.test("validation uses RFC 7807", () => {
        pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json");
        const body = pm.response.json();
        pm.expect(body.status).to.eql(400);
        pm.expect(body.detail).to.be.a("string").and.not.empty;
      });
    language: text/javascript
order: 5000
