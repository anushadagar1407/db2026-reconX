$kind: http-request
url: "{{baseUrl}}/v1/trades"
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 403", () => pm.response.to.have.status(403));
      pm.test("authorization runs before body validation", () => pm.expect(pm.response.text()).to.eql(""));
    language: text/javascript
order: 1000
