$kind: http-request
url: "{{baseUrl}}/v1/trades/{{tradeId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 204", () => pm.response.to.have.status(204));
      pm.test("response body is empty", () => pm.expect(pm.response.text()).to.eql(""));
    language: text/javascript
order: 7000
