$kind: http-request
url: "{{baseUrl}}/v1/trades/{{tradeId}}/status"
method: PATCH
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "MATCHED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test("trade status is MATCHED", () => pm.expect(pm.response.json().status).to.eql("MATCHED"));
      }
    language: text/javascript
order: 6000
