$kind: http-request
url: "{{baseUrl}}/v1/trades?from=2026-04-01&to=2026-07-31&status=MATCHED&counterpartyId={{testCounterpartyId}}&size=10"
method: GET
headers:
  - key: Accept
    value: application/json
queryParams:
  - key: from
    value: '2026-04-01'
  - key: to
    value: '2026-07-31'
  - key: status
    value: MATCHED
  - key: counterpartyId
    value: '{{testCounterpartyId}}'
  - key: size
    value: '10'
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const body = pm.response.json();
        pm.test("filters are honored", () => {
          pm.expect(body.items).to.be.an("array");
          body.items.forEach((trade) => {
            pm.expect(trade.status).to.eql("MATCHED");
            pm.expect(String(trade.counterpartyId)).to.eql(pm.collectionVariables.get("testCounterpartyId"));
            pm.expect(trade.tradeDate >= "2026-04-01" && trade.tradeDate <= "2026-07-31").to.be.true;
          });
        });
      }
    language: text/javascript
order: 3000
