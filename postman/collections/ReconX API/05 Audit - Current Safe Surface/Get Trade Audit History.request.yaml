$kind: http-request
url: "{{baseUrl}}/v1/audit/trades/{{seedTradeRef}}"
method: GET
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.test("audit history is a list", () => pm.expect(pm.response.json()).to.be.an("array"));
    language: text/javascript
order: 1000
