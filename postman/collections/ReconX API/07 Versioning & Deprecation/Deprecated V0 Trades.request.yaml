$kind: http-request
url: "{{baseUrl}}/v0/trades"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 410", () => pm.response.to.have.status(410));
      pm.test("deprecation metadata names the successor", () => {
        pm.expect(pm.response.headers.get("Deprecation")).to.eql("true");
        pm.expect(pm.response.headers.get("Sunset")).to.be.a("string").and.not.empty;
        pm.expect(pm.response.headers.get("Link")).to.eql("</api/v1/trades>; rel=\"successor-version\"");
      });
      ["adminToken", "traderToken", "viewerToken", "reconToken", "seedTradeId", "seedTradeRef", "testInstrumentId", "testCounterpartyId", "tradeId", "tradeRef", "tradeDate", "jobId"].forEach((key) => pm.collectionVariables.unset(key));
    language: text/javascript
order: 1000
