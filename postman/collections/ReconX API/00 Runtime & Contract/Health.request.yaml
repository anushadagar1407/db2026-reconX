$kind: http-request
description: Public liveness check used by Docker Compose. Health details vary with authorization and runtime profile.
url: "{{baseUrl}}/actuator/health"
method: GET
headers:
  - key: Accept
    value: application/json
scripts:
  - type: beforeRequest
    code: '["adminToken", "traderToken", "viewerToken", "reconToken", "seedTradeId", "seedTradeRef", "testInstrumentId", "testCounterpartyId", "tradeId", "tradeRef", "tradeDate", "jobId"].forEach((key) => pm.collectionVariables.unset(key));'
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.test("application reports UP", () => {
        const body = pm.response.json();
        pm.expect(body.status).to.eql("UP");
      });
    language: text/javascript
order: 1000
