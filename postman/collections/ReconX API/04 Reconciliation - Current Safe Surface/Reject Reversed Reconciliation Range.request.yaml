$kind: http-request
url: "{{baseUrl}}/v1/recon/run"
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "from": "2026-05-01",
      "to": "2026-04-01",
      "counterpartyId": {{testCounterpartyId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 400", () => pm.response.to.have.status(400));
      pm.test("date validation problem is returned", () => {
        const body = pm.response.json();
        pm.expect(body.status).to.eql(400);
        pm.expect(body.detail).to.be.a("string").and.not.empty;
      });
    language: text/javascript
order: 3000
