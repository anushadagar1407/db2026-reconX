$kind: http-request
url: "{{baseUrl}}/v1/recon/jobs/{{jobId}}/results"
method: GET
headers:
  - key: Accept
    value: application/json
auth:
  type: bearer
  credentials:
    token: "{{viewerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.test("results use the current list shape", () => pm.expect(pm.response.json()).to.be.an("array"));
    language: text/javascript
order: 2000
