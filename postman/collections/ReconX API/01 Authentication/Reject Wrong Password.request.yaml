$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "definitely-wrong"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 401", () => pm.response.to.have.status(401));
      pm.test("credentials failure is generic", () => {
        const body = pm.response.json();
        pm.expect(body.status).to.eql(401);
        pm.expect(body.detail).to.eql("Invalid credentials");
      });
    language: text/javascript
order: 5000
