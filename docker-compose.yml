# =============================================================================
# TICKET-ADV148 — 7-service stack: backend, frontend, postgres, kafka, zookeeper,
#                prometheus, grafana (+ optional kafdrop behind "debug" profile)
# TICKET-ADV152 — Health checks gate dependent services
# =============================================================================
services:

  postgres:
    image: postgres:16-alpine
    container_name: reconx-postgres
    environment:
      POSTGRES_DB:       reconx
      POSTGRES_USER:     reconx_user
      POSTGRES_PASSWORD: reconx_pass
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconx_user -d reconx"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [reconx]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: reconx-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    networks: [reconx]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: reconx-kafka
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [reconx]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: reconx-backend:local
    container_name: reconx-backend
    depends_on:
      postgres: {condition: service_healthy}
      kafka:    {condition: service_healthy}
    ports: ["${BACKEND_PORT:-8080}:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: uat
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB:   reconx
      POSTGRES_USER: reconx_user
      POSTGRES_PASSWORD: reconx_pass
      KAFKA_BOOTSTRAP: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-32-bytes-min!!}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [reconx]

  frontend:
    build: ./frontend
    image: reconx-frontend:local
    container_name: reconx-frontend
    depends_on:
      backend: {condition: service_healthy}
    ports: ["5173:80"]
    networks: [reconx]

  presentation:
    profiles: ["presentation"]
    build: ./presentation
    image: reconx-presentation:local
    container_name: reconx-presentation
    depends_on:
      frontend: {condition: service_started}
    ports: ["4173:80"]
    environment:
      RECONX_DEMO_URL: ${RECONX_DEMO_URL:-http://localhost:5173}
    networks: [reconx]

  test-postgres:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: reconx_test
      POSTGRES_USER: reconx_test
      POSTGRES_PASSWORD: reconx_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconx_test -d reconx_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [reconx]

  test-backend:
    image: reconx-backend-test:local
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      # Database-backed tests activate the test profile; other slices retain native Maven parity.
      RECONX_TEST_DATABASE_PROVIDER: external
      TEST_POSTGRES_HOST: test-postgres
      TEST_POSTGRES_PORT: 5432
      TEST_POSTGRES_DB: reconx_test
      TEST_POSTGRES_USER: reconx_test
      TEST_POSTGRES_PASSWORD: reconx_test
    depends_on:
      test-postgres: {condition: service_healthy}
    networks: [reconx]

  test-frontend:
    image: reconx-frontend-test:local
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: test
    networks: [reconx]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: reconx-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    networks: [reconx]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: reconx-grafana
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]
    networks: [reconx]

  # Optional — bring up with `--profile debug`
  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.1
    container_name: reconx-kafdrop
    profiles: ["debug"]
    depends_on: [kafka]
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"
    ports: ["9000:9000"]
    networks: [reconx]

networks:
  reconx:

volumes:
  postgres_data:
  grafana_data:
